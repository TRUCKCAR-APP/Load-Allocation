server:
  port: 8083

spring:
  application:
    name: ms-load-allocation

  datasource:
    # Fuera de Docker (IDE/tests) la conexión es directa y el esquema va en currentSchema. En Docker se pasa por
    # PgBouncer y el search_path lo fija el rol del servicio.
    # docker-compose y Kubernetes pasan SPRING_DATASOURCE_URL; el valor por defecto es para el IDE y los tests.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/truckcar_db?currentSchema=load_allocation,public}
    username: ${DB_USER:truckcar_admin}
    # Sin valor por defecto: fuera de Docker se define DB_PASSWORD (en el CI, el de su PostgreSQL efímero).
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincida con las entidades.
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    # Esquema propio del servicio (rol y esquema creados por db-init); el historial de Flyway vive en él.
    schemas: load_allocation
    default-schema: load_allocation
    # Bases anteriores a Flyway (tablas creadas por Hibernate): línea base 0 para que V1 (idempotente) se aplique.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: load-allocation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

truckcar:
  kafka:
    topic:
      load-events: ${TRUCKCAR_LOAD_EVENTS_TOPIC:truckcar.events.load-allocation}
      assignment-notifications: ${TRUCKCAR_ASSIGNMENT_NOTIFICATIONS_TOPIC:truckcar.events.assignment-notifications}
      allocation-results: ${TRUCKCAR_ALLOCATION_RESULTS_TOPIC:truckcar.events.fleet-allocation-results}
  assignment:
    max-attempts: ${TRUCKCAR_ASSIGNMENT_MAX_ATTEMPTS:5}
    response-timeout-minutes: ${TRUCKCAR_ASSIGNMENT_RESPONSE_TIMEOUT_MINUTES:5}
    timeout-check-interval-ms: ${TRUCKCAR_ASSIGNMENT_TIMEOUT_CHECK_INTERVAL_MS:30000}
  outbox:
    publish-interval-ms: ${TRUCKCAR_OUTBOX_PUBLISH_INTERVAL_MS:1000}
    batch-size: ${TRUCKCAR_OUTBOX_BATCH_SIZE:100}
  # Enlaces públicos de seguimiento: token HMAC-SHA256 (secret >= 32 bytes; vacío = clave temporal por proceso),
  # vencen a las 48 h o 6 h después de la entrega. public-base-url es la PWA que abre el enlace (?track=<token>).
  tracking:
    secret: ${TRUCKCAR_TRACKING_LINK_SECRET:}
    public-base-url: ${TRUCKCAR_PUBLIC_APP_URL:http://localhost:5500/}
    max-ttl: 48h
    after-delivery: 6h
    fleets-drivers-url: ${TRUCKCAR_SERVICES_FLEETS_DRIVERS_URL:http://localhost:8081}
  # Evidencias de entrega (POD) en almacenamiento S3. endpoint: dirección interna para HeadObject/PutObject (vacío =
  # Amazon S3). public-endpoint: base con la que se firman las URLs que usa la PWA; en Docker es el nginx del
  # frontend (/pod-media/ en el mismo origen que la app).
  storage:
    s3:
      endpoint: ${TRUCKCAR_S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${TRUCKCAR_S3_PUBLIC_ENDPOINT:http://localhost:5500}
      region: ${TRUCKCAR_S3_REGION:us-east-1}
      bucket: ${TRUCKCAR_S3_BUCKET:pod-media}
      # Sin credenciales por defecto: vacías, el SDK usa la cadena estándar de AWS (rol IAM / IRSA).
      access-key: ${TRUCKCAR_S3_ACCESS_KEY:}
      secret-key: ${TRUCKCAR_S3_SECRET_KEY:}
      path-style: true
      upload-url-ttl: 10m
      download-url-ttl: 10m
      max-photo-bytes: 5242880
      max-signature-bytes: 524288
# ── Observabilidad ──────────────────────────────────────────────────────────────────────────────
# /actuator/prometheus solo es accesible dentro de la red interna: el api-gateway no enruta /actuator/**.
# Las trazas se exportan por OTLP al otel-collector cuando se define MANAGEMENT_OTLP_TRACING_ENDPOINT (en Docker,
# http://otel-collector:4318/v1/traces); sin ella no se exporta nada.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRUCKCAR_TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      # X-Correlation-Id (lo genera el api-gateway) viaja como cabecera propia en HTTP y en Kafka y se copia al MDC.
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id

logging:
  # [servicio,traceId,spanId] en cada línea de log y, en las peticiones que lo traen, el X-Correlation-Id.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] [cid=%X{X-Correlation-Id:-}] "
