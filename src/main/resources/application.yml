server:
  port: 8083

spring:
  application:
    name: ms-load-allocation

  datasource:
    url: jdbc:postgresql://localhost:5432/truckdar_db
    username: truckdar_admin
    password: truckdar_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: load-allocation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

truckdar:
  kafka:
    topic:
      load-events: ${TRUCKDAR_LOAD_EVENTS_TOPIC:truckdar.events.load-allocation}
      assignment-notifications: ${TRUCKDAR_ASSIGNMENT_NOTIFICATIONS_TOPIC:truckdar.events.assignment-notifications}
  outbox:
    publish-interval-ms: ${TRUCKDAR_OUTBOX_PUBLISH_INTERVAL_MS:1000}
    batch-size: ${TRUCKDAR_OUTBOX_BATCH_SIZE:100}